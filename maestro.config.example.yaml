# Maestro config — EXAMPLE (spec §5). Copy to maestro.config.yaml and edit. The live
# maestro.config.yaml is committed config-as-code and changes as you add repos; this file
# stays a stable, representative reference (and the schema test fixture). Secrets live in
# .env (gitignored); token_env holds the NAME of the env var, never the value.
defaults:
  poll_interval_active: 30s # repos with active maestro work
  poll_interval_idle: 5m # repos with nothing in flight (adaptive polling)
  poll_jitter: 5s # spread requests to avoid bursts/rate limits
  bot_user: maestro-bot
  # Coding agent the daemon runs (daemon-global). 'claude' (default) or 'codex'.
  # `command` overrides the binary/path; defaults to the kind name.
  agent:
    kind: claude
    # runner: herdr controls HOW the agent runs, orthogonal to `kind` (which one):
    # 'headless' (default) is a cold `claude -p`/`codex exec` call; 'herdr' hosts the
    # agent in a named herdr TUI session instead, so a human can attach mid-run.
    # runner: herdr
    # herdr:
    #   command: herdr             # optional: override the herdr binary/path
    #   workspace_label: maestro   # herdr workspace the daemon's tabs live in
    #   env:                       # set on every run's pane — the pane inherits the herdr
    #     # SERVER's env, not the daemon's, so the agent ACCOUNT must be selected here;
    #     # without it the pane's claude is NOT LOGGED IN. Forge token_env names are
    #     # always blanked in the pane regardless of what env says (§13.1).
    #     CLAUDE_CONFIG_DIR: /home/bot/.claude-bot
  concurrency:
    global_max: 2 # concurrent ACTIVE workers — size to RAM (§14)
  workspaces:
    root: ./workspaces
    disk_cap: 20GB # evict above this
    cleanup: lru # lru | on_terminal
    clone_filter: blob:none # partial clone (#27); null = full clone

# Forge configs: single-object shorthand (one host per kind) or array
# (multiple hosts per kind — e.g. gitlab.com + self-hosted).
forges:
  gitlab:
    host: gitlab.com
    token_env: MAESTRO_GITLAB_TOKEN
  github:
    host: github.com
    token_env: MAESTRO_GITHUB_TOKEN

repos:
  - url: gitlab.com/group/api # forge inferred from host
  - url: github.com/org/web
  # Self-hosted GitLab example (needs a second entry in forges.gitlab array):
  # - url: git.digital-masters.de/digitalmasters/internal-tools/dm-docu-gen
    overrides:
      concurrency:
        max_active: 1
