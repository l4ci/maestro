# Maestro global config (spec §5). Committed. Secrets live in .env (gitignored);
# token_env below holds the NAME of the env var, never the value.
defaults:
  poll_interval_active: 30s # repos with active maestro work
  poll_interval_idle: 5m # repos with nothing in flight (adaptive polling)
  poll_jitter: 5s # spread requests to avoid bursts/rate limits
  bot_user: l4ci
  concurrency:
    global_max: 2 # concurrent ACTIVE workers — size to RAM (§14)
  workspaces:
    root: ./workspaces
    disk_cap: 20GB # evict above this
    cleanup: lru # lru | on_terminal

forges:
  gitlab:
    - host: gitlab.com
      token_env: MAESTRO_GITLAB_TOKEN
    - host: git.digital-masters.de
      token_env: MAESTRO_DM_GITLAB_TOKEN
      bot_user: volker.otto # usernames are per-forge; overrides defaults.bot_user on this host
  github:
    host: github.com
    token_env: MAESTRO_GITHUB_TOKEN

repos:
  [
    { url: github.com/l4ci/maestro },
    { url: git.digital-masters.de/digitalmasters/internal-tools/dm-docu-gen }
  ]
